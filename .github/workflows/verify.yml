name: Verify Godot baseline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, codex/harness-leak-debug]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.3
  GODOT_ARCHIVE: Godot_v4.6.3-stable_mono_linux_x86_64.zip
  GODOT_SHA512: 962c4f5fd3a704de36c9dedcb2f5f6c973065ac8ed8fd6e12c7ebf7e48c3852d774bcef2ccf76b50b206c0c564ceea54315e2943e76e397529923e7de680508e

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422

      - name: Install headful capture support
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Download verified Godot 4.6.3 Mono
        run: |
          curl --fail --location --retry 3 --output "$GODOT_ARCHIVE" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"
          echo "${GODOT_SHA512}  ${GODOT_ARCHIVE}" | sha512sum --check --strict
          unzip -q "$GODOT_ARCHIVE" -d "$RUNNER_TEMP/godot"
          GODOT_BINARY="$(find "$RUNNER_TEMP/godot" -type f \( -name 'Godot*_linux_x86_64' -o -name 'Godot*_linux.x86_64' \) -print -quit)"
          test -n "$GODOT_BINARY"
          chmod +x "$GODOT_BINARY"
          echo "GODOT=$GODOT_BINARY" >> "$GITHUB_ENV"

      - name: Verify pinned toolchain
        timeout-minutes: 3
        run: pwsh -File ./tools/dev.ps1 verify -GodotPath "$GODOT"

      - name: Harness supervisor contract tests
        timeout-minutes: 5
        run: pwsh -NoProfile -File ./tests/harness_runner_tests.ps1

      - name: Build C# without warnings
        timeout-minutes: 8
        run: pwsh -File ./tools/dev.ps1 build -GodotPath "$GODOT"

      # TEMPORARY DEBUG (scratch branch only): enumerate leak diagnostics per smoke test.
      - name: Enumerate smoke-test leak diagnostics (advisory)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import >/dev/null 2>&1
          for t in tests/*smoke_test.gd; do
            name=$(basename "$t")
            "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script "res://$t" > "/tmp/$name.log" 2>&1
            code=$?
            leaks=$(grep -c -i -E 'leaked at exit|still in use at exit|^SCRIPT ERROR' "/tmp/$name.log")
            echo "RESULT $name exit=$code leak_markers=$leaks"
          done

      - name: Verbose leak detail for harness_profile_smoke_test
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script res://tests/harness_profile_smoke_test.gd --verbose > /tmp/profile-verbose.log 2>&1
          echo "=== verbose markers ==="
          grep -n -i -B 3 -A 40 'leaked at exit' /tmp/profile-verbose.log | head -n 160
          echo "=== verbose tail ==="
          tail -n 50 /tmp/profile-verbose.log

      - name: Import, smoke test, and boot for 180 frames
        timeout-minutes: 10
        run: pwsh -File ./tools/dev.ps1 test -GodotPath "$GODOT"

      # Advisory until a few runs show the structural ceiling is stable on this runner.
      # Flip to a blocking step by removing continue-on-error once the numbers are trusted.
      - name: Performance budget (advisory)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          xvfb-run --auto-servernum "$GODOT" --path "$GITHUB_WORKSPACE" \
            --perf-scenario=solo-default --perf-output=artifacts/performance/ci \
            --perf-warmup=6 --perf-duration=10
          pwsh -File ./tools/check-perf-budget.ps1 -SummaryPath artifacts/performance/ci

      - name: Capture and check teardown diagnostics
        timeout-minutes: 10
        run: xvfb-run --auto-servernum pwsh -File ./tools/dev.ps1 capture -GodotPath "$GODOT" -State gameplay -Output artifacts/harness/ci/gameplay.png -TimeoutSeconds 180

      - name: Reject generated configuration or metadata changes
        timeout-minutes: 2
        run: |
          git diff --exit-code -- project.godot kart_racer.csproj global.json
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload harness evidence and failure logs
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: |
            artifacts/harness/
            artifacts/performance/
          if-no-files-found: ignore
